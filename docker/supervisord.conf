[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# Without these two sections supervisorctl has no transport to talk over and
# every invocation dies with "ini file does not include supervisorctl section",
# which leaves an operator no way to restart one service inside the container.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# The MariaDB program lives in this directory so the entrypoint can delete it
# when DB_HOST points at an external server.
[include]
files = /etc/supervisord.d/*.ini

[program:freeswitch]
command=/usr/bin/freeswitch -nf -nonat -u freeswitch -g freeswitch
autorestart=true
priority=20
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:httpd]
command=/usr/local/bin/wait-for-db.sh /usr/sbin/httpd -DFOREGROUND
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# The listener that accepts email to fax submissions, plus a queue runner for
# the fax to email direction. Wrapped because neither of sendmail's daemon modes
# is directly supervisable here; see the comment in sendmail-fg.sh.
[program:sendmail]
command=/usr/local/bin/sendmail-fg.sh
autorestart=true
priority=25
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# cron.php is a one shot script that upstream runs from crontab every minute,
# so it needs a sleep loop rather than being supervised as a daemon.
[program:ictcore-cron]
command=/usr/local/bin/wait-for-db.sh /bin/bash -c "while true; do /usr/bin/php /usr/ictcore/bin/cron.php || true; sleep 60; done"
user=ictcore
autorestart=true
priority=40
startsecs=0
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
