# Loaded as zz-ictfax.conf so it lands after ictcore.conf and its Alias /api
# wins over the DocumentRoot below.

DocumentRoot "/usr/ictfax"

<Directory "/usr/ictfax">
    # Every Option needs its own sign or httpd refuses to start the whole server.
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Angular does its own routing, so a reload on a deep link like
    # /pages/fax/inbox has to be handed back index.html instead of a 404.
    RewriteEngine On
    RewriteBase /
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ /index.html [L]
</Directory>

# The service worker must never be cached or an upgrade can leave browsers
# pinned to the previous build indefinitely.
<Files "ngsw-worker.js">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
</Files>
<Files "index.html">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
</Files>
